<body class="bg-gradient-to-br from-amber-100 via-purple-100 to-pink-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-purple-200">

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

    <!-- Main Container -->
    <main class="w-full max-w-xl bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-purple-100 p-6 md:p-8 flex flex-col items-center text-center relative overflow-hidden my-auto">
        
        <!-- App Install Banner (PWA Trigger) -->
        <div id="install-banner" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-2xl p-3.5 mb-4 shadow-md flex items-center justify-between gap-2 hidden animate-popIn">
            <div class="flex items-center gap-2 text-left">
                <span class="text-2xl">📱</span>
                <div>
                    <p class="font-extrabold text-xs">앱으로 편리하게 사용하기!</p>
                    <p class="text-[10px] text-purple-200">홈 화면에 추가하여 스마트폰 앱으로 설치하세요.</p>
                </div>
            </div>
            <button id="install-btn" class="px-3.5 py-1.5 bg-white text-purple-700 font-bold text-xs rounded-xl shadow active:scale-95 transition-all whitespace-nowrap">
                📲 앱 설치하기
            </button>
        </div>

        <!-- Header Section -->
        <header class="mb-4 z-10">
            <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xs md:text-sm rounded-full shadow-md mb-2 animate-bounceSoft">
                🎂 Happy Birthday!
            </span>
            <h1 class="text-2xl md:text-3xl font-black text-gray-800 tracking-tight mb-1">
                생일 축하 선물 뽑기 🎁
            </h1>
            <p class="text-gray-600 text-xs md:text-sm font-medium">
                하단의 버튼을 눌러 룰렛을 돌리고 행운의 선물을 확인해 보세요!
            </p>
        </header>

        <!-- Roulette Wheel Section -->
        <section class="relative my-2 flex flex-col items-center justify-center">
            <!-- Top Pointer -->
            <div class="z-20 -mb-4 w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-t-[32px] border-t-rose-600 drop-shadow-md"></div>
            
            <!-- Wheel Outer Rim -->
            <div class="relative p-2.5 bg-gradient-to-tr from-purple-300 via-pink-200 to-amber-200 rounded-full shadow-xl border-4 border-white">
                <canvas id="roulette-canvas" width="320" height="320" class="rounded-full shadow-inner max-w-full h-auto"></canvas>
                
                <!-- Center Cap -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-white rounded-full shadow-lg border-4 border-purple-400 flex items-center justify-center font-black text-lg text-purple-600 select-none">
                    🎁
                </div>
            </div>
        </section>

        <!-- Dynamic Result Box -->
        <div id="result-box" class="w-full bg-purple-50/80 border-2 border-dashed border-purple-200 rounded-2xl p-4 my-3 min-h-[85px] flex items-center justify-center">
            <p id="status-message" class="text-purple-700 font-bold text-sm md:text-base animate-pulse">
                ✨ 아래 '룰렛 돌리기' 버튼을 눌러 선물을 뽑아주세요!
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="w-full mt-1 flex flex-col gap-2">
            <button id="spin-btn" onclick="spinWheel()" class="w-full py-3.5 bg-gradient-to-r from-purple-600 via-pink-600 to-rose-500 hover:from-purple-700 hover:to-rose-600 text-white font-extrabold text-base md:text-lg rounded-2xl shadow-lg shadow-purple-500/30 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
                <span>🎯 룰렛 돌리기</span>
            </button>
            
            <button onclick="downloadPWAFile()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow transition-all flex items-center justify-center gap-2">
                <span>💾 PWA 단일 파일(.html) 내 기기에 다운로드</span>
            </button>
        </div>

    </main>

    <!-- Footer with Stats -->
    <footer class="mt-4 text-center text-gray-500 text-xs flex flex-col items-center gap-1.5 w-full max-w-xl">
        <div class="flex flex-wrap items-center justify-center gap-2 md:gap-3 bg-white/80 backdrop-blur-sm px-4 py-2 rounded-2xl border border-purple-100 shadow-sm text-gray-600 font-medium text-[11px] md:text-xs w-full">
            <span>👥 총 참여자 수: <strong id="participant-count" class="text-purple-600 font-bold">0</strong>명</span>
            <span class="text-gray-300">|</span>
            <span>🌐 접속 IP: <strong id="user-ip" class="text-pink-600 font-bold">211.204.110.11</strong></span>
            <span class="text-gray-300">|</span>
            <span>🎯 내 기회: <strong id="user-spin-count" class="text-indigo-600 font-bold">5/5</strong>회 남음</span>
        </div>
        <p class="text-[11px] text-gray-500 mt-1">
            📱 <strong>앱 설치 방법:</strong> 모바일 브라우저 메뉴의 <strong>[홈 화면에 추가]</strong> 또는 <strong>[앱 설치]</strong>를 클릭하세요.
        </p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const gifts = [
            { id: 1, title: "상품권 10만 원", emoji: "💳", color: "#8B5CF6", textColor: "#FFFFFF", isBoom: false },
            { id: 2, title: "아웃백 시식권 5만 원", emoji: "🥩", color: "#EC4899", textColor: "#FFFFFF", isBoom: false },
            { id: 3, title: "생일 케이크 3만 원", emoji: "🎂", color: "#F59E0B", textColor: "#FFFFFF", isBoom: false },
            { id: 4, title: "꽝!", emoji: "💣", color: "#6B7280", textColor: "#FFFFFF", isBoom: true }
        ];

        let currentGiftList = [];
        let canvas, ctx;
        let startAngle = 0;
        let arc;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        let isSpinning = false;

        let totalSpinCount = 0;
        let targetIndex = 3;

        const MAX_USER_SPINS = 5;
        let userIpAddress = "127.0.0.1";
        let userSpinCount = 0;
        let deferredPrompt = null;

        function initUserInfo() {
            document.getElementById('participant-count').textContent = totalSpinCount;

            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    userIpAddress = data.ip || "127.0.0.1";
                    document.getElementById('user-ip').textContent = userIpAddress;
                    loadUserSpinLimit();
                })
                .catch(() => {
                    userIpAddress = "127.0.0.1";
                    document.getElementById('user-ip').textContent = userIpAddress;
                    loadUserSpinLimit();
                });
        }

        function loadUserSpinLimit() {
            const storageKey = `spin_count_${userIpAddress}`;
            const storedSpins = localStorage.getItem(storageKey);
            userSpinCount = storedSpins ? parseInt(storedSpins, 10) : 0;
            updateUserSpinCountDisplay();
        }

        function updateUserSpinCountDisplay() {
            const remainingSpins = Math.max(0, MAX_USER_SPINS - userSpinCount);
            document.getElementById('user-spin-count').textContent = `${remainingSpins}/${MAX_USER_SPINS}`;

            if (userSpinCount >= MAX_USER_SPINS) {
                const spinBtn = document.getElementById("spin-btn");
                spinBtn.disabled = true;
                spinBtn.classList.add("opacity-50", "cursor-not-allowed");
                spinBtn.innerHTML = `<span>🚫 참여 횟수 초과 (최대 5회)</span>`;

                const statusMsg = document.getElementById("status-message");
                statusMsg.innerHTML = `<span class="text-rose-600 font-bold">⚠️ 한 IP당 최대 5회까지만 참여 가능합니다!</span>`;
            }
        }

        function initWheel() {
            canvas = document.getElementById("roulette-canvas");
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            currentGiftList = [...gifts];
            arc = Math.PI / (currentGiftList.length / 2);
            
            drawRouletteWheel();
            initUserInfo();
        }

        function drawRouletteWheel() {
            if (!ctx) return;

            const outsideRadius = 150;
            const textRadius = 105;
            const insideRadius = 30;

            ctx.clearRect(0, 0, 320, 320);
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 3;

            for (let i = 0; i < currentGiftList.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = currentGiftList[i].color;

                ctx.beginPath();
                ctx.arc(160, 160, outsideRadius, angle, angle + arc, false);
                ctx.arc(160, 160, insideRadius, angle + arc, angle, true);
                ctx.stroke();
                ctx.fill();

                ctx.save();
                ctx.fillStyle = currentGiftList[i].textColor;
                ctx.shadowBlur = 4;
                ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
                ctx.translate(
                    160 + Math.cos(angle + arc / 2) * textRadius,
                    160 + Math.sin(angle + arc / 2) * textRadius
                );
                ctx.rotate(angle + arc / 2 + Math.PI / 2);

                const text = currentGiftList[i].title;
                const emoji = currentGiftList[i].emoji;

                ctx.font = "bold 20px 'Noto Sans KR', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(emoji, 0, -10);

                ctx.font = "bold 12px 'Noto Sans KR', sans-serif";
                ctx.fillText(text, 0, 12);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning) return;

            if (userSpinCount >= MAX_USER_SPINS) {
                updateUserSpinCountDisplay();
                return;
            }

            isSpinning = true;
            totalSpinCount++;
            userSpinCount++;

            localStorage.setItem(`spin_count_${userIpAddress}`, userSpinCount);
            updateUserSpinCountDisplay();

            document.getElementById('participant-count').textContent = totalSpinCount;

            const spinBtn = document.getElementById("spin-btn");
            const statusMsg = document.getElementById("status-message");

            spinBtn.disabled = true;
            spinBtn.classList.add("opacity-50", "cursor-not-allowed");
            spinBtn.innerHTML = `<span>🎰 룰렛 돌아가는 중...</span>`;

            statusMsg.textContent = `두구두구... 과연 어떤 선물이 나올까요? 🎁`;
            statusMsg.className = "text-purple-700 font-bold text-sm md:text-base animate-pulse";

            // 30th spin overall = Gift Card 100k (id: 1), all others = Boom (id: 4)
            let desiredGiftId = (totalSpinCount === 30) ? 1 : 4;
            targetIndex = currentGiftList.findIndex(g => g.id === desiredGiftId);

            const targetSegmentAngle = targetIndex * arc + arc / 2;
            let desiredFinalAngle = (1.5 * Math.PI) - targetSegmentAngle;
            desiredFinalAngle = (desiredFinalAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

            let currentNormalized = (startAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
            let extraRotations = 5 * 2 * Math.PI; 
            let angleDiff = desiredFinalAngle - currentNormalized;
            if (angleDiff < 0) angleDiff += 2 * Math.PI;

            let totalRotationNeeded = extraRotations + angleDiff;

            spinTime = 0;
            spinTimeTotal = 4000;
            spinAngleStart = totalRotationNeeded;

            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 20;
            if (spinTime >= spinTimeTotal) {
                stopRotateWheel();
                return;
            }
            
            const currentProgress = spinTime / spinTimeTotal;
            const easedProgress = 1 - Math.pow(1 - currentProgress, 3);
            const prevProgress = (spinTime - 20) / spinTimeTotal;
            const prevEased = 1 - Math.pow(1 - prevProgress, 3);

            const deltaRad = (easedProgress - prevEased) * spinAngleStart;
            startAngle += deltaRad;

            drawRouletteWheel();
            spinTimeout = setTimeout(rotateWheel, 20);
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            isSpinning = false;

            const winningGift = currentGiftList[targetIndex];
            const statusMsg = document.getElementById("status-message");
            const spinBtn = document.getElementById("spin-btn");

            if (!winningGift.isBoom) {
                triggerConfetti();
                statusMsg.innerHTML = `<span class="text-2xl block mb-1">${winningGift.emoji}</span>🎉 축하합니다!<br><strong class="text-pink-600 font-black text-xl md:text-2xl">[${winningGift.title}]</strong> 당첨!`;
            } else {
                statusMsg.innerHTML = `<span class="text-2xl block mb-1">💣</span><span class="text-gray-700 font-bold text-sm md:text-base">아쉽게도 꽝입니다! 다음에 다시 도전해 보세요!</span>`;
            }

            if (userSpinCount >= MAX_USER_SPINS) {
                spinBtn.disabled = true;
                spinBtn.classList.add("opacity-50", "cursor-not-allowed");
                spinBtn.innerHTML = `<span>🚫 참여 횟수 초과 (최대 5회)</span>`;
            } else {
                spinBtn.disabled = false;
                spinBtn.classList.remove("opacity-50", "cursor-not-allowed");
                spinBtn.innerHTML = `<span>🔄 룰렛 다시 돌리기</span>`;
            }
        }

        function triggerConfetti() {
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti({
                    ...defaults,
                    ...opts,
                    particleCount: Math.floor(count * particleRatio)
                });
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        function downloadPWAFile() {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '생일축하_선물룰렛_PWA.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBanner = document.getElementById('install-banner');
            if (installBanner) installBanner.classList.remove('hidden');
        });

        document.getElementById('install-btn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-banner')?.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        window.onload = function() {
            initWheel();
        };
    </script>

</body></html>
